# The memory of the demands of a long chain (K116, D144): bench/chain-memory.ts on 3 runners.
# A change of the study script starts it. A person or a session can also start it with another length. No gate reads it.
name: Chain memory

on:
  pull_request:
    paths:
      - packages/core/bench/chain-memory.ts
      - packages/core/bench/memory.ts
      - .github/workflows/chain-memory.yml
  workflow_dispatch:
    inputs:
      nodes:
        description: The nodes of the chain
        type: string
        default: "100000"

permissions:
  contents: read

# A failure of the script on the left of the pipe of tee fails its step.
defaults:
  run:
    shell: bash

concurrency:
  group: chain-memory-${{ github.ref }}-${{ inputs.nodes || '100000' }}
  cancel-in-progress: true

jobs:
  run:
    name: run ${{ matrix.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The study
        env:
          NODES: ${{ inputs.nodes || '100000' }}
        run: pnpm exec tsx packages/core/bench/chain-memory.ts "$NODES" | tee "$RUNNER_TEMP/chain-memory-${{ matrix.run }}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chain-memory-${{ matrix.run }}
          path: ${{ runner.temp }}/chain-memory-${{ matrix.run }}.txt
          if-no-files-found: error
          retention-days: 90
