# K229, one-off, on a branch that does not merge. It reads PLAN.LEAN in fresh processes on one runner, in three arms.
# The file name stays levels.yml, because a dispatch needs a workflow that main already knows.
name: Levels

on:
  workflow_dispatch:
    inputs:
      processes:
        description: The fresh processes of each arm
        default: "20"

permissions:
  contents: read

concurrency:
  group: k229-read-${{ github.sha }}
  cancel-in-progress: false

jobs:
  arms:
    name: arms ${{ matrix.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        run: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Read each arm
        shell: bash
        working-directory: packages/core
        env:
          COEVAL_MEASURE: "1"
          N: ${{ inputs.processes }}
        run: |
          echo "Runner: cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs) image=$ImageVersion kernel=$(uname -r) node=$(node -v) thp=$(cat /sys/kernel/mm/transparent_hugepage/enabled)"
          read_once() {
            pnpm exec vitest run src/plan.test.ts src/merge.test.ts -t "PLAN.LEAN|WORLD.LAWS" "$@" 2>&1 \
              | grep -oE 'MEASURE \{"id":"PLAN\.LEAN","bytes":[0-9.]+' | head -1 | sed 's/.*://'
          }
          for arm in plain predictable seeds; do
            case "$arm" in
              plain) flags=() ;;
              predictable) flags=(--execArgv=--predictable) ;;
              seeds) flags=(--execArgv=--random-seed=1 --execArgv=--hash-seed=1) ;;
            esac
            values=""
            for ((i = 1; i <= N; i += 1)); do
              values="$values $(read_once "${flags[@]}")"
            done
            echo "ARM $arm:$values"
          done
