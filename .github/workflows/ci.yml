# The CI of coeval: the shared CI of mark1russell7 (reusable-ci.yml of mark1russell7/template, its
# CI.md). The job runs typecheck, test, the npm build of each package that has one (with its publint
# check, as release.yml builds it) and lint:ste (the writing rules, ASD-STE100, of the README files
# and the doc comments) on Node.js 26.
name: CI

on:
  push:
  pull_request:
  # release.yml starts these gates before a release
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: mark1russell7/template/.github/workflows/reusable-ci.yml@f91ce0164de724a6fe81c8f9868f92892dfd9a98 # main
    with:
      # The property test of one meaning (K9) examines more documents in CI than in a local run
      env: '{"COEVAL_AGREE_COUNT": "2000"}'
