# The CI of coeval: the shared CI of mark1russell7 (reusable-ci.yml of mark1russell7/template, its
# CI.md). The job runs typecheck, test, the npm build of each package that has one (with its publint
# check, as release.yml builds it) and lint:ste (the writing rules, ASD-STE100, of the README files
# and the doc comments) on Node.js 26.
name: CI

on:
  push:
  pull_request:
  # release.yml starts these gates before a release
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: mark1russell7/template/.github/workflows/reusable-ci.yml@68e160e7cae2f00c2c8b401d514f4a1e2e6d1967 # main
    with:
      # The property test of one meaning (K9) examines more documents in CI than in a local run
      env: '{"COEVAL_AGREE_COUNT": "2000"}'

  # The one check that the ruleset of main names (CI.md of the template, "The check of the ruleset").
  # It needs each job of the merge gate. Security, AI review and the bench stay in their own files:
  # release.yml calls this file with "contents: read" only, so a job here cannot ask for more.
  ci-ok:
    name: CI OK
    if: always()
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Each job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1 ;; esac
