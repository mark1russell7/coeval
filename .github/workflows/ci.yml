# The CI of coeval: the shared CI of mark1russell7 (reusable-ci.yml of mark1russell7/template, its
# CI.md). The job runs typecheck, test, the npm build of each package that has one (with its publint
# check, as release.yml builds it) and lint:ste (the writing rules, ASD-STE100, of the README files
# and the doc comments) on Node.js 26.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml starts these gates before a release
  workflow_call:
  # A person starts a run on a branch with no pull request: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  ci:
    uses: mark1russell7/template/.github/workflows/reusable-ci.yml@d20d75b11120af71eaf6d2f59385c9cd053fff8b # main
    with:
      # The property test of one meaning (K9) examines more documents in CI than in a local run
      env: '{"COEVAL_AGREE_COUNT": "2000"}'

  # The one check that the ruleset of main names (CI.md of the template, "The check of the ruleset").
  # It needs each job of the merge gate. Security, AI review and the bench stay in their own files:
  # release.yml calls this file with "contents: read" only, so a job here cannot ask for more.
  ci-ok:
    name: CI OK
    if: ${{ !cancelled() }}
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Each job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          # The jobs that their own if may skip, separated by spaces. Each other job must pass.
          ALLOW_SKIP: ""
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"' > results
          cat results
          if [ ! -s results ]; then echo "::error::no job in needs"; exit 1; fi
          bad=0
          while read -r job result; do
            case "$result" in
              success) ;;
              skipped) case " $ALLOW_SKIP " in *" $job "*) ;; *) echo "::error::$job was skipped, and ALLOW_SKIP does not name it"; bad=1 ;; esac ;;
              *) echo "::error::$job: $result"; bad=1 ;;
            esac
          done < results
          exit $bad
