# The property test of one meaning (K9, D15) with many documents: each night, and by hand.
# Each run of the schedule uses new seeds, thus the nights together examine new documents.
# A failure names the seed and the document. COEVAL_AGREE_SEED reproduces it in a local run.
name: One meaning

on:
  schedule:
    - cron: "46 3 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: The number of documents for each configuration
        default: "20000"

permissions:
  contents: read

# The account runs at most 40 jobs at one time. A newer run cancels an older run of the same event, and at most 3 parts
# run at one time. A dispatch takes its own count of documents, thus it does not cancel a run of the schedule.
concurrency:
  group: agree-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agree:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run src/agree.test.ts
        working-directory: packages/core
        env:
          COEVAL_AGREE_COUNT: ${{ inputs.count || '20000' }}
          COEVAL_AGREE_SEED: ${{ github.run_number }}${{ matrix.part }}
