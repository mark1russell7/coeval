# The Lean model of the formula kit (K96, D159): each night, by hand, and on a pull request that changes the model.
# The job builds the model and runs AGREE.LEAN. A failure names the document, the result of the model and the plan.
name: Lean model

on:
  schedule:
    - cron: "4 4 * * *"
  workflow_dispatch:
    inputs:
      count:
        description: The number of documents
        default: "20000"
  pull_request:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  LEAN_VERSION: 4.35.0
  LEAN_SHA256: 7289597a44543246c9227b8cae501767e095ce17f6d448b95fc4a8dc97268f6d

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@4466542421ef76bcb3ccf5b5e1765d4f509f8f4f # main
        with:
          paths: |
            .github/workflows/lean.yml
            packages/core/src/lean.test.ts
            proofs/**

  lean:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The toolchain comes from the release of the version in proofs/lean-toolchain, with a pinned hash.
      - name: Install Lean
        run: |
          grep -qx "leanprover/lean4:v$LEAN_VERSION" proofs/lean-toolchain
          curl -fsSL -o lean.tar.zst "https://github.com/leanprover/lean4/releases/download/v$LEAN_VERSION/lean-$LEAN_VERSION-linux.tar.zst"
          echo "$LEAN_SHA256  lean.tar.zst" | sha256sum -c -
          mkdir "$RUNNER_TEMP/lean"
          tar --zstd -xf lean.tar.zst -C "$RUNNER_TEMP/lean" --strip-components=1
          rm lean.tar.zst
          echo "$RUNNER_TEMP/lean/bin" >> "$GITHUB_PATH"
      - run: lake build
        working-directory: proofs
      - run: pnpm exec vitest run src/lean.test.ts
        working-directory: packages/core
        env:
          COEVAL_LEAN_MODEL: ${{ github.workspace }}/proofs/.lake/build/bin/coeval-model
          COEVAL_LEAN_COUNT: ${{ inputs.count || '20000' }}
          COEVAL_LEAN_SEED: ${{ github.run_number }}

  lean-ok:
    name: Lean OK
    if: ${{ !cancelled() }}
    needs: [changes, lean]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@4466542421ef76bcb3ccf5b5e1765d4f509f8f4f # main
        with:
          needs: ${{ toJSON(needs) }}
