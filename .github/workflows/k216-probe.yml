# The probe of K216 (not for main): the time, the profile and the deopts of the tree cases on each arm.
name: K216 probe

on:
  push:
    branches: [k216-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check out the base commit
        run: git worktree add --detach "$RUNNER_TEMP/base" 6bdf00fded5bac5146eee0a7cb377c9a88884ac7
      - name: Probe
        run: pnpm exec tsx packages/core/bench/k216-probe.ts "$RUNNER_TEMP/base/packages/core/src/index.ts" packages/core/src/index.ts "$RUNNER_TEMP/probe"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: k216-probe-${{ matrix.run }}
          path: ${{ runner.temp }}/probe
          if-no-files-found: warn
          retention-days: 14
