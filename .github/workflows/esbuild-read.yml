# One sizing read of K233 on a branch that does not merge: the bundle hash and the time per version of esbuild.
name: esbuild read

on:
  push:
    branches: [k233-read]

permissions:
  contents: read

concurrency:
  group: esbuild-read
  cancel-in-progress: true

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node packages/core/bench/esbuild-read.ts
