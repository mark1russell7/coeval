# The speed of plans and paths (K12, D29, K101): the base commit and this commit on one machine.
# Each copy runs in its own processes, and a second copy of the base gives the noise floor (A/A) of each case.
# Two jobs make the same comparison on two runners (K167, D71). The job "verdict" merges their two tables.
# The bench core @mark1russell7/rigor-bench starts the processes and gives the verdict of each case (K212, D114).
# The bench jobs print numbers, in their logs and in their summaries. Only the job "Speed OK" blocks a merge.
# A shared local machine gives unreliable numbers, thus the measurements run here.
# A slower case under a hold (D117) turns "Speed OK" red, unless a record in bench/accepted accepts it (K239, D173).
# A slower case on equal arms stays report only, thus a green "Speed OK" does not say that the code is not slower.
# A crash, a short run or a missing arm turns it red (K235, D167).
# The lock file is on the filter, so a dependency update shows that the bench still runs. Both arms run with one
# install, so such a run does not read a slowdown from a dependency (K232, D166). Each arm builds with the esbuild of
# its own lock file, so a new version of esbuild gives a time read (K233, D172). The root package.json is not on the
# filter: it holds the pnpm version, and that version changes nothing that the arms run unless the lock file moves.
name: Speed

on:
  # Each pull request starts this workflow, so its summary check is always there. The job changes skips the
  # work when the pull request changes no file of the gate (CI.md of the template, "A gate with paths").
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: The commit to compare with
        default: origin/main
      # A control run gives more rounds and more jobs, to read how the job-to-job spread compares with a margin (K225).
      rounds:
        description: The rounds of each job
        default: "12"
      jobs:
        description: The jobs, as a JSON list of numbers
        default: "[1, 2]"
      # This input stops each bench job at its start, to read that Speed OK goes red (K235, D167).
      fault:
        description: Write crash to stop each bench job at its start
        default: ""

permissions:
  contents: read

# Two dispatches on one branch with different bases do not cancel each other.
concurrency:
  group: bench-${{ github.ref }}-${{ inputs.base }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    env:
      GATE_PATHS: |
        packages/core/src/**
        packages/core/bench/**
        .github/workflows/bench.yml
        pnpm-lock.yaml
        packages/core/package.json
        packages/core/tsconfig.json
        pnpm-workspace.yaml
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@e077054e0f2ebb8441e4bc525b56cf2acc2afb6f # main
        with:
          paths: ${{ env.GATE_PATHS }}
      # The action reads the files of a pull request from the API, so this step gives its rules a list of files.
      # A list with no lock file reads false, so each line of the check can fail (K232, D166).
      - name: The filter on fixtures (K232, D166)
        run: |
          rules=("${RUNNER_WORKSPACE%/*}"/_actions/mark1russell7/template/*/.github/actions/changes/match.jq)
          if [ "${#rules[@]}" != 1 ] || [ ! -f "${rules[0]}" ]; then echo "::error::No single match.jq of the action changes."; exit 1; fi
          check() {
            got=$(printf '%s\n' "$3" | jq -R -s -r --arg paths "$2" --arg ignore "" -f "${rules[0]}")
            echo "FIXTURE $1: $got"
            if [ "$got" != "$4" ]; then echo "::error::The filter reads $got for $1, not $4."; exit 1; fi
          }
          check "the lock file" "$GATE_PATHS" pnpm-lock.yaml true
          check "a docs file" "$GATE_PATHS" docs/ROADMAP.md false
          check "the lock file with no lock line" "$(printf '%s\n' "$GATE_PATHS" | grep -v '^pnpm-lock.yaml$')" pnpm-lock.yaml false

  bench:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    name: bench (run ${{ matrix.run }})
    runs-on: ubuntu-latest
    # The fresh runner starts four processes for each case and round (D114), thus the job gets more time.
    # A dispatch with more rounds gets 60 minutes.
    timeout-minutes: ${{ fromJSON(inputs.rounds || '12') > 12 && 60 || 15 }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        run: ${{ fromJSON(inputs.jobs || '[1, 2]') }}
    steps:
      - name: The injected crash (K235, D167)
        if: inputs.fault == 'crash'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check out the base commit
        run: git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
      # The script prints base, head and differ for the outputs. A lock file with no esbuild gives differ=false.
      - name: The esbuild of each arm (K233, D172)
        id: esbuild
        run: node packages/core/bench/esbuild.ts "$RUNNER_TEMP/base/pnpm-lock.yaml" pnpm-lock.yaml | tee -a "$GITHUB_OUTPUT"
      - name: Install the esbuild of the base (K233, D172)
        if: steps.esbuild.outputs.differ == 'true'
        run: npm install --prefix "$RUNNER_TEMP/esbuild-base" --no-audit --no-fund "esbuild@$VERSION"
        env:
          VERSION: ${{ steps.esbuild.outputs.base }}
      - name: Compare the base with this commit
        run: pnpm exec tsx packages/core/bench/paths.ts "$RUNNER_TEMP/base/packages/core/src/index.ts" packages/core/src/index.ts
        env:
          BENCH_BASE_ESBUILD: ${{ steps.esbuild.outputs.differ == 'true' && format('{0}/esbuild-base', runner.temp) || '' }}
          BENCH_RUN: ${{ matrix.run }}
          BENCH_ROUNDS: ${{ inputs.rounds || '12' }}
          BENCH_JSON: ${{ runner.temp }}/bench-${{ matrix.run }}.json
      # A run with different results also gives its table to the verdict.
      # The records stay 90 days, because the limits of the verdict come from them (K214, D117).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: bench-run-${{ matrix.run }}
          path: ${{ runner.temp }}/bench-${{ matrix.run }}.json
          if-no-files-found: warn
          retention-days: 90

  verdict:
    needs: [changes, bench]
    if: ${{ needs.changes.outputs.match == 'true' && (!cancelled()) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      state: ${{ steps.merge.outputs.state }}
      reason: ${{ steps.merge.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The script imports the bench core @mark1russell7/rigor-bench (D114), thus the job installs the packages.
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bench-run-*
          merge-multiple: true
          path: ${{ runner.temp }}/bench
      - name: Merge the two runs
        id: merge
        if: ${{ !cancelled() }}
        run: node packages/core/bench/merge.ts "$RUNNER_TEMP/bench/bench-1.json" "$RUNNER_TEMP/bench/bench-2.json"

  speed-ok:
    name: Speed OK
    if: ${{ !cancelled() }}
    needs: [changes, bench, verdict]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.match == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.match == 'true'
        with:
          node-version: 26
      # An empty state is red, so a crash cannot pass by writing nothing. A held slower case with no record is red (K239).
      - name: Read the state of the verdict (K235, D167)
        if: needs.changes.outputs.match == 'true'
        run: node packages/core/bench/speed-read.ts
        env:
          STATE: ${{ needs.verdict.outputs.state }}
          REASON: ${{ needs.verdict.outputs.reason }}
      - uses: mark1russell7/template/.github/actions/gate-summary@e077054e0f2ebb8441e4bc525b56cf2acc2afb6f # main
        if: always()
        with:
          needs: ${{ toJSON(needs) }}
          allow-skip: verdict
