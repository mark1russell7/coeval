# The speed of plans and paths (K12, D29, K101): the base commit and this commit on one machine.
# Each copy runs in its own processes, and a second copy of the base gives the noise floor (A/A) of each case.
# Two jobs make the same comparison on two runners (K167, D71). The job "verdict" merges their two tables.
# A case is slower or faster only when both runs are over the bound in the same direction.
# The jobs only print numbers, in their logs and in their summaries. They do not block a merge.
# A shared local machine gives unreliable numbers, thus the measurements run here.
name: Speed

on:
  # Each pull request starts this workflow, so its summary check is always there. The job changes skips the
  # work when the pull request changes no file of the gate (CI.md of the template, "A gate with paths").
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: The commit to compare with
        default: origin/main

permissions:
  contents: read

# Two dispatches on one branch with different bases do not cancel each other.
concurrency:
  group: bench-${{ github.ref }}-${{ inputs.base }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@e035fa69560ec82e176f1f7bdcb6760c8b15af54 # main
        with:
          paths: |
            packages/core/src/**
            packages/core/bench/**
            .github/workflows/bench.yml

  bench:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    name: bench (run ${{ matrix.run }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        run: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check out the base commit
        run: git worktree add --detach "$RUNNER_TEMP/base" "$BASE"
        env:
          BASE: ${{ github.event.pull_request.base.sha || inputs.base }}
      - name: Compare the base with this commit
        run: pnpm exec tsx packages/core/bench/paths.ts "$RUNNER_TEMP/base/packages/core/src/index.ts" packages/core/src/index.ts
        env:
          BENCH_RUN: ${{ matrix.run }}
          BENCH_JSON: ${{ runner.temp }}/bench-${{ matrix.run }}.json
      # A run with different results also gives its table to the verdict.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: bench-run-${{ matrix.run }}
          path: ${{ runner.temp }}/bench-${{ matrix.run }}.json
          if-no-files-found: warn
          retention-days: 14

  verdict:
    needs: [changes, bench]
    if: ${{ needs.changes.outputs.match == 'true' && (!cancelled()) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: packages/core/bench
      # Node removes the types of merge.ts, and the script uses only the modules of Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/download-artifact@v8
        with:
          pattern: bench-run-*
          merge-multiple: true
          path: ${{ runner.temp }}/bench
      - name: Merge the two runs
        if: ${{ !cancelled() }}
        run: node packages/core/bench/merge.ts "$RUNNER_TEMP/bench/bench-1.json" "$RUNNER_TEMP/bench/bench-2.json"

  speed-ok:
    name: Speed OK
    if: always()
    needs: [changes, bench, verdict]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@e035fa69560ec82e176f1f7bdcb6760c8b15af54 # main
        with:
          needs: ${{ toJSON(needs) }}
          allow-skip: verdict
