# The measures that derive the limits of the unit tests (K200, D95): the same test on 5 runners.
# A limit is the worst value of the runs plus the spread of the values. A seeded count is the same in each run, thus a test pins it.
# Each job prints its values in its log and in its summary. A local machine is shared, thus the measures run here.
# The jobs "ladder" measure the slope of the walks of STATIC.LINEAR (K208, D97). The job "ladder-verdict" pools them.
# The job "ladder-flip" reads injected walks with the slopes 2, 1.3 and 1 at one setting. The gate must read block, block and pass (K227, D164).
# The jobs "mode" compare each bench case alone with the same case in the order of cases.ts (K210, D98).
# Each part measures 8 cases on its runner in 341 processes, approximately 2 minutes by the times of run 41430307699.
# The job "mode-verdict" pools the parts.
name: Measure

on:
  # Each pull request starts this workflow, so its summary check is always there. Two jobs of the action "changes"
  # skip the work when the pull request changes no file of a gate (CI.md of the template, "A gate with paths").
  # The job "core-changes" starts the job "measure". The job "changes" starts the jobs "mode". The job "ladder-changes"
  # starts the jobs "ladder", because a change of the kernel can change the slope of a walk (D164).
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: measure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@5b6d568175b98264391a21a9da059df7be51d85e # main
        with:
          paths: |
            .github/workflows/measure.yml
            packages/core/bench/mode.ts

  ladder-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@5b6d568175b98264391a21a9da059df7be51d85e # main
        with:
          paths: |
            packages/core/src/**
            packages/core/bench/ladder.ts
            pnpm-lock.yaml
            .github/workflows/measure.yml

  # The job "checks" of ci.yml does not apply the limit of PLAN.LEAN. Thus the job "measure" is its gate (K211, D104).
  core-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@5b6d568175b98264391a21a9da059df7be51d85e # main
        with:
          paths: |
            packages/core/src/**
            packages/core/package.json
            pnpm-lock.yaml
            .github/workflows/measure.yml

  measure:
    needs: core-changes
    if: needs.core-changes.outputs.match == 'true'
    name: measure (run ${{ matrix.run }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        run: [1, 2, 3, 4, 5]
        # The flip test of this gate (K227, D162). This row runs the same step with 20 bytes more on the value of PLAN.LEAN.
        # The 5 jobs above are the copy with no fault. The lowest value of D161 is 391.1, so 20 bytes pass the limit in each job.
        include:
          - run: flip
            inject: "20"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PLAN.LEAN and WORLD.LAWS
        id: plan
        # Only the flip row continues, and its next step decides. The outcome of this step stays failure.
        continue-on-error: ${{ matrix.inject != '' }}
        working-directory: packages/core
        # The default shell has no pipefail, and the pipe into tee then hid each failed test of this step (K228).
        shell: bash
        env:
          COEVAL_MEASURE: "1"
          COEVAL_MEASURE_INJECT: ${{ matrix.inject }}
        run: |
          # K229 reads the values of PLAN.LEAN against these facts of the runner, and the logs do not name all of them.
          echo "Runner: cpu=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | xargs) image=$ImageVersion kernel=$(uname -r) node=$(node -v) thp=$(cat /sys/kernel/mm/transparent_hugepage/enabled)"
          pnpm exec vitest run src/plan.test.ts src/merge.test.ts -t "PLAN.LEAN|WORLD.LAWS" 2>&1 | tee out.txt
          grep -o 'MEASURE {.*}' out.txt | sed 's/^MEASURE //' > measures.jsonl
          cat measures.jsonl
          { echo "### Run ${{ matrix.run }}"; echo '```'; cat measures.jsonl; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # A step that stays green with the injected value is a gate that does not hold. Another failure of the step is no flip.
      - name: The injected value turned the step red, by the limit of PLAN.LEAN
        if: ${{ matrix.inject != '' }}
        working-directory: packages/core
        env:
          OUTCOME: ${{ steps.plan.outcome }}
        run: |
          test "$OUTCOME" = failure
          grep -q 'bytes for each plan' out.txt

  ladder:
    needs: ladder-changes
    if: needs.ladder-changes.outputs.match == 'true'
    name: ladder (run ${{ matrix.run }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        run: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: STATIC.LINEAR
        env:
          LADDER_RUN: ${{ matrix.run }}
          LADDER_JSON: ${{ runner.temp }}/ladder-${{ matrix.run }}.json
        run: pnpm exec tsx packages/core/bench/ladder.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ladder-run-${{ matrix.run }}
          path: ${{ runner.temp }}/ladder-${{ matrix.run }}.json
          if-no-files-found: warn
          retention-days: 90

  ladder-verdict:
    needs: [ladder-changes, ladder]
    if: ${{ !cancelled() && needs.ladder-changes.outputs.match == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The script imports the statistics of @mark1russell7/rigor-statistics (D114), thus the job installs the packages.
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ladder-run-*
          merge-multiple: true
          path: ${{ runner.temp }}/ladder
      # The gate is report only (D164): the exit code 3 of a block keeps the job green, and each other failure turns it red.
      - name: Pool the five runs
        env:
          LADDER_BLOCK: "1"
        run: node packages/core/bench/ladder.ts merge "$RUNNER_TEMP"/ladder/ladder-*.json || test $? -eq 3

  ladder-flip:
    needs: ladder-changes
    if: needs.ladder-changes.outputs.match == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each row: a name, the repeats at the four rungs, the exit code, and the text of the gate. 8 repeats at each rung give
      # a slope of 1 with the same work per rung as the slope of 1.3, so that row is the copy with no fault at one setting.
      - name: Three walks at one setting
        shell: bash
        run: |
          fail=0
          for row in 'slope-2 1,2,4,8 3 block' 'slope-1.3 8,10,12,15 3 block' 'linear 8,8,8,8 0 pass'; do
            read -r name times want gate <<< "$row"
            LADDER_INJECT="$times" LADDER_JSON="$RUNNER_TEMP/$name.json" pnpm exec tsx packages/core/bench/ladder.ts 250 10
            code=0
            LADDER_BLOCK=1 node packages/core/bench/ladder.ts merge "$RUNNER_TEMP/$name.json" 2>&1 | tee "$name.txt" || code=$?
            echo "Flip row $name: exit code $code, expected $want."
            test "$code" = "$want" || fail=1
            grep -q "Gate (report only, D164): $gate" "$name.txt" || fail=1
          done
          for name in slope-2 slope-1.3; do
            for reason in 'refsOf is not linear' 'walk is not linear' 'memory of refsOf is over the bound' 'memory of walk is over the bound'; do
              grep -q "$reason" "$name.txt" || { echo "Flip row $name has no reason: $reason."; fail=1; }
            done
          done
          exit "$fail"

  mode:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    name: mode (part ${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Each case alone and in order
        env:
          MODE_PART: ${{ matrix.part }}
          MODE_PARTS: "2"
          MODE_JSON: ${{ runner.temp }}/mode-${{ matrix.part }}.json
        run: pnpm exec tsx packages/core/bench/mode.ts packages/core/src/index.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: mode-part-${{ matrix.part }}
          path: ${{ runner.temp }}/mode-${{ matrix.part }}.json
          if-no-files-found: warn
          retention-days: 90

  mode-verdict:
    needs: [changes, mode]
    if: ${{ !cancelled() && needs.changes.outputs.match == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The script imports the bench core @mark1russell7/rigor-bench (D114), thus the job installs the packages.
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mode-part-*
          merge-multiple: true
          path: ${{ runner.temp }}/mode
      - name: Pool the parts
        run: node packages/core/bench/mode.ts merge "$RUNNER_TEMP"/mode/mode-*.json

  measure-ok:
    name: Measure OK
    if: always()
    needs: [changes, core-changes, ladder-changes, measure, ladder, ladder-verdict, ladder-flip, mode, mode-verdict]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    # The action "gate-summary" reads one job of the action "changes". Thus each step gets one filter and its jobs.
    steps:
      - name: The jobs of the filter "changes"
        uses: mark1russell7/template/.github/actions/gate-summary@5b6d568175b98264391a21a9da059df7be51d85e # main
        with:
          needs: >-
            {"changes": ${{ toJSON(needs.changes) }}, "mode": ${{ toJSON(needs.mode) }},
            "mode-verdict": ${{ toJSON(needs.mode-verdict) }}}
      # The next steps also run when an earlier step failed, thus the summary shows each verdict.
      - name: The jobs of the filter "ladder-changes"
        if: ${{ !cancelled() }}
        uses: mark1russell7/template/.github/actions/gate-summary@5b6d568175b98264391a21a9da059df7be51d85e # main
        with:
          changes: ladder-changes
          needs: >-
            {"ladder-changes": ${{ toJSON(needs.ladder-changes) }}, "ladder": ${{ toJSON(needs.ladder) }},
            "ladder-verdict": ${{ toJSON(needs.ladder-verdict) }}, "ladder-flip": ${{ toJSON(needs.ladder-flip) }}}
      - name: The jobs of the filter "core-changes"
        if: ${{ !cancelled() }}
        uses: mark1russell7/template/.github/actions/gate-summary@5b6d568175b98264391a21a9da059df7be51d85e # main
        with:
          changes: core-changes
          needs: >-
            {"core-changes": ${{ toJSON(needs.core-changes) }}, "measure": ${{ toJSON(needs.measure) }}}
