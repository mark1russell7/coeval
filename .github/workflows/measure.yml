# The measures that derive the limits of the unit tests (K200, D95): the same test on 5 runners.
# A limit is the worst value of the 5 runs times 1.1. A seeded count is the same in each run, thus a test pins it.
# Each job prints its values in its log and in its summary. A local machine is shared, thus the measures run here.
# The jobs "ladder" measure the slope of the walks of STATIC.LINEAR (K208, D97). The job "ladder-verdict" pools them.
name: Measure

on:
  pull_request:
    paths:
      - ".github/workflows/measure.yml"
      - "packages/core/bench/ladder.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: measure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: measure (run ${{ matrix.run }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        run: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PLAN.LEAN and WORLD.LAWS
        working-directory: packages/core
        env:
          COEVAL_MEASURE: "1"
        run: |
          pnpm exec vitest run src/plan.test.ts src/merge.test.ts -t "PLAN.LEAN|WORLD.LAWS" | tee out.txt
          grep -o 'MEASURE {.*}' out.txt | sed 's/^MEASURE //' > measures.jsonl
          cat measures.jsonl
          { echo "### Run ${{ matrix.run }}"; echo '```'; cat measures.jsonl; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  ladder:
    name: ladder (run ${{ matrix.run }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        run: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: STATIC.LINEAR
        env:
          LADDER_RUN: ${{ matrix.run }}
          LADDER_JSON: ${{ runner.temp }}/ladder-${{ matrix.run }}.json
        run: pnpm exec tsx packages/core/bench/ladder.ts
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ladder-run-${{ matrix.run }}
          path: ${{ runner.temp }}/ladder-${{ matrix.run }}.json
          if-no-files-found: warn
          retention-days: 14

  ladder-verdict:
    needs: ladder
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: packages/core/bench
      # Node removes the types of ladder.ts, and the mode "merge" uses only the modules of Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - uses: actions/download-artifact@v8
        with:
          pattern: ladder-run-*
          merge-multiple: true
          path: ${{ runner.temp }}/ladder
      - name: Pool the five runs
        run: node packages/core/bench/ladder.ts merge "$RUNNER_TEMP"/ladder/ladder-*.json
