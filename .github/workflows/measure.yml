# The measures that derive the limits of the unit tests (K200, D95): the same test on 5 runners.
# A limit is the worst value of the 5 runs times 1.1. A seeded count is the same in each run, thus a test pins it.
# Each job prints its values in its log and in its summary. A local machine is shared, thus the measures run here.
name: Measure

on:
  pull_request:
    paths:
      - ".github/workflows/measure.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: measure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  measure:
    name: measure (run ${{ matrix.run }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        run: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PLAN.LEAN and WORLD.LAWS
        working-directory: packages/core
        env:
          COEVAL_MEASURE: "1"
        run: |
          pnpm exec vitest run src/plan.test.ts src/merge.test.ts -t "PLAN.LEAN|WORLD.LAWS" | tee out.txt
          grep -o 'MEASURE {.*}' out.txt | sed 's/^MEASURE //' > measures.jsonl
          cat measures.jsonl
          { echo "### Run ${{ matrix.run }}"; echo '```'; cat measures.jsonl; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
