# The flip of the ladder gate at the setting of the plain gate: 5 runners, 30 rounds, one call of each walk (K227, D164).
# Each runner measures a linear walk, and a walk with a true slope of 1.25. That slope is over the size that the gate prints.
# The job "ladder-flip" of the workflow "measure" runs on each change of the kernel, on one runner. It holds the code of the
# verdict. This workflow holds the size. A block that does not come means that the printed size is wrong.
# The workflow "measure" calls this workflow on each change of the code of the gate, and its check "Measure OK" reads the result.
name: Ladder plain

on:
  # One morning each week, on the minute that the rule runner-budget gives this file.
  schedule:
    - cron: "25 5 * * 2"
  # A one-off read can name another slope. The weekly run and the call from "measure" use 1.25.
  workflow_dispatch:
    inputs:
      fault:
        description: The true slope of the walk with a fault
        type: string
        default: "1.25"
  # The weekly run covers a change of the lock file.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ladder-plain-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run:
    name: run ${{ matrix.run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        run: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: A linear walk
        env:
          LADDER_RUN: ${{ matrix.run }}
          LADDER_JSON: ${{ runner.temp }}/linear-${{ matrix.run }}.json
        run: pnpm exec tsx packages/core/bench/ladder.ts
      - name: A walk with a fault
        env:
          LADDER_INJECT: ${{ inputs.fault || '1.25' }}
          LADDER_RUN: ${{ matrix.run }}
          LADDER_JSON: ${{ runner.temp }}/fault-${{ matrix.run }}.json
        run: pnpm exec tsx packages/core/bench/ladder.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ladder-plain-${{ matrix.run }}
          path: |
            ${{ runner.temp }}/linear-${{ matrix.run }}.json
            ${{ runner.temp }}/fault-${{ matrix.run }}.json
          if-no-files-found: error
          retention-days: 90

  verdict:
    needs: run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The script imports the statistics of @mark1russell7/rigor-statistics (D114), thus the job installs the packages.
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ladder-plain-*
          merge-multiple: true
          path: ${{ runner.temp }}/plain
      - name: The gate reads a pass and a block
        shell: bash
        env:
          LADDER_BLOCK: "1"
          FAULT: ${{ inputs.fault || '1.25' }}
        run: |
          fail=0
          code=0
          node packages/core/bench/ladder.ts merge "$RUNNER_TEMP"/plain/linear-*.json 2>&1 | tee linear.txt || code=$?
          echo "The linear walk: exit code $code, expected 0."
          test "$code" = 0 || fail=1
          grep -q 'Gate (report only, D164): pass' linear.txt || fail=1
          code=0
          node packages/core/bench/ladder.ts merge "$RUNNER_TEMP"/plain/fault-*.json 2>&1 | tee fault.txt || code=$?
          echo "The slope of $FAULT: exit code $code, expected 3."
          test "$code" = 3 || { echo "No read at the plain setting: the printed size is wrong."; fail=1; }
          reasons=('refsOf is not linear' 'walk is not linear')
          memory=('memory of refsOf is over the bound' 'memory of walk is over the bound')
          # Over the memory limit of 1.2, a fault blocks on time and on memory. At or under it, a memory reason is a block on the wrong reason.
          if awk -v slope="$FAULT" 'BEGIN { exit !(slope + 0 > 1.2) }'; then
            reasons+=("${memory[@]}")
          else
            for reason in "${memory[@]}"; do
              if grep -q "$reason" fault.txt; then echo "The slope of $FAULT has the wrong reason: $reason."; fail=1; fi
            done
          fi
          for reason in "${reasons[@]}"; do
            grep -q "$reason" fault.txt || { echo "The slope of $FAULT has no reason: $reason."; fail=1; }
          done
          exit "$fail"
