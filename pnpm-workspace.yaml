packages:
  - "packages/*"

# Packages allowed to run install scripts. Since pnpm 11 every other package that has one fails the install.
# cue comes from npm and has no install script, thus it needs no approval.
allowBuilds:
  esbuild: true

# Our own packages: the release train updates them, so the release age check of pnpm does not apply to them (D93).
minimumReleaseAgeExclude:
  - "@mark1russell7/*"
  - "@procedures/*"
