packages:
  - "packages/*"

# Packages allowed to run install scripts. Since pnpm 11 every other package that has one fails the install.
# cue comes from npm and has no install script, thus it needs no approval.
allowBuilds:
  esbuild: true

# The own packages that this repository uses: the release train updates them, so the release age check of pnpm does
# not apply to them. Each other package keeps the check (D92).
minimumReleaseAgeExclude:
  - "@mark1russell7/conventions"
  - "@mark1russell7/cue"
  - "@mark1russell7/ste-lint"
  - "@mark1russell7/template-cli"
